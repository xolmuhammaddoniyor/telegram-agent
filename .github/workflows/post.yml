# Bu fayl avtomatik yaratilgan: python agent.py --workflow > .github/workflows/post.yml
# config.yaml o'zgarsa, qayta yarating. GitHub cron vaqti UTC da va bir necha daqiqa kechikishi mumkin.
name: Telegram post

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      post:
        description: "Hozir yuboriladigan post raqami (0 dan boshlanadi)"
        required: true
        default: "0"

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Post yuborish
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CRON: ${{ github.event.schedule }}
          POST: ${{ inputs.post }}
        run: |
          if [ -n "$CRON" ]; then
            python agent.py --cron "$CRON"
          else
            python agent.py --now "$POST"
          fi
